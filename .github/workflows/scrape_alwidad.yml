name: Scrape Alwidad Products

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 lxml
          playwright install --with-deps chromium

      - name: Scrape source products
        run: python scrape_alwidad.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_products.json source_products.csv
          git diff --cached --quiet || git commit -m "Update Alwidad source product data"
          git push

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: alwidad-source-products
          path: |
            source_products.json
            source_products.csv

